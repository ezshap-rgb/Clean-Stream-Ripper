<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Clean Stream Ripper</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#070913">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header matching Clean Audio Trimmer brand style -->
    <header>
      <div class="brand">
        <img src="icon.png" alt="Clean Stream Ripper Logo" class="brand-logo-img">
        <div class="brand-text">
          <h1>Clean Stream Ripper</h1>
          <p>Personal YouTube & Media Stream Ripper</p>
        </div>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Ready</span>
      </div>
    </header>

    <!-- URL Input Card -->
    <div class="card">
      <div class="card-title-row">
        <span class="card-label">YouTube Video or Stream URL</span>
      </div>
      <div class="input-group">
        <div class="input-wrapper">
          <input 
            type="url" 
            id="urlInput" 
            class="url-input" 
            placeholder="Paste YouTube video or stream link..." 
            autocomplete="off" 
            spellcheck="false"
          >
          <button id="btnPaste" class="btn-paste" title="Paste from clipboard">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            Paste
          </button>
        </div>
        <button id="btnInspect" class="btn-gradient">
          <span id="inspectSpinner" class="spinner hidden"></span>
          <span id="inspectText">Inspect</span>
        </button>
      </div>
    </div>

    <!-- Video Preview & Configuration Card (hidden initially) -->
    <div id="previewCard" class="card preview-card hidden">
      <div class="card-title-row">
        <span class="card-label">Media Preview & Options</span>
      </div>

      <div class="video-meta-box">
        <div class="thumbnail-wrap">
          <img id="metaThumb" class="thumbnail-img" src="" alt="Thumbnail">
          <span id="metaDuration" class="duration-badge">00:00</span>
        </div>
        <div class="meta-details">
          <div id="metaTitle" class="meta-title">Video Title</div>
          <div id="metaChannel" class="meta-channel">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span id="channelName">Channel</span>
          </div>
        </div>
      </div>

      <!-- Mode Selector Pills -->
      <div class="mode-pills">
        <button id="btnModeVideo" class="pill-btn active video-active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          Video (MP4)
        </button>
        <button id="btnModeAudio" class="pill-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          Audio Only (MP3)
        </button>
      </div>

      <!-- Format & Quality Options -->
      <div class="options-grid">
        <div id="videoQualityBox" class="control-field">
          <label class="field-label" for="selectResolution">Target Resolution</label>
          <select id="selectResolution" class="select-styled">
            <option value="best">Best Available (up to 4K)</option>
            <option value="1080" selected>1080p Full HD</option>
            <option value="720">720p HD</option>
            <option value="480">480p SD</option>
            <option value="360">360p Compact</option>
          </select>
        </div>

        <div id="audioFormatBox" class="control-field hidden">
          <label class="field-label" for="selectAudioFormat">Audio Codec & Bitrate</label>
          <select id="selectAudioFormat" class="select-styled">
            <option value="mp3" selected>MP3 High Quality (320kbps)</option>
            <option value="m4a">Original AAC (M4A container)</option>
          </select>
        </div>
      </div>

      <!-- Time Slicing / Trimmer Section -->
      <div class="trimmer-section">
        <div class="trimmer-header" id="trimmerHeader">
          <div class="trimmer-header-left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="6" cy="6" r="3"></circle>
              <circle cx="6" cy="18" r="3"></circle>
              <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
              <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
              <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
            </svg>
            <span>Clip Specific Segment (Optional)</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="chkTrim">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div id="trimInputsRow" class="trim-inputs-row hidden">
          <div class="time-input-box">
            <label class="field-label">Start Time (HH:MM:SS)</label>
            <input type="text" id="trimStart" placeholder="00:00:00" value="00:00:00">
          </div>
          <div class="time-input-box">
            <label class="field-label">End Time (HH:MM:SS)</label>
            <input type="text" id="trimEnd" placeholder="00:05:00">
          </div>
        </div>
      </div>

      <button id="btnStartDownload" class="btn-gradient">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Start Rip & Download
      </button>
    </div>

    <!-- Real-time Progress Card (hidden initially) -->
    <div id="progressCard" class="card progress-card hidden">
      <div class="progress-header">
        <span id="phasePill" class="phase-pill">
          <span class="spinner" style="width: 12px; height: 12px; border-width: 1.5px;"></span>
          <span id="phaseText">Downloading Stream...</span>
        </span>
        <span id="percentText" class="percent-text">0.0%</span>
      </div>

      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <div class="progress-stats-row">
        <span id="statSpeed">Speed: -- MB/s</span>
        <span id="statSize">0 / 0 MB</span>
        <span id="statEta">ETA: --:--</span>
      </div>
    </div>

    <!-- Completed Download Card (hidden initially) -->
    <div id="completeCard" class="card complete-card hidden">
      <div class="complete-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div>
        <div class="complete-title">Rip Complete & Ready!</div>
        <div id="completeFileName" class="complete-file-name">video.mp4</div>
      </div>
      <div class="complete-actions">
        <a id="btnDownloadFile" class="btn-gradient" href="#" download>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Save to Device
        </a>
        <button id="btnShareFile" class="btn-secondary hidden">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          Share
        </button>
        <button id="btnReset" class="btn-secondary">
          Rip Another
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
